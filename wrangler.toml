# Cloudflare Configuration for Factory Gate Vehicle Access System (Neon Postgres Backend)
name = "factory-gate-access"
main = "_worker.js"
compatibility_date = "2024-09-23"

# Static Assets Configuration (Enables direct npx wrangler deploy)
[assets]
directory = "."
binding = "ASSETS"

# Neon Serverless Postgres Configuration:
# Set secret via: npx wrangler secret put DATABASE_URL
# Or for local development in .dev.vars: DATABASE_URL="postgresql://user:pass@ep-xyz.us-east-2.aws.neon.tech/neondb?sslmode=require"


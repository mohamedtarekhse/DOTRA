# Cloudflare Configuration for Factory Gate Vehicle Access System
name = "factory-gate-access"
main = "_worker.js"
compatibility_date = "2024-09-23"

# Static Assets Configuration (Enables direct npx wrangler deploy)
[assets]
directory = "."
binding = "ASSETS"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "dotra-traffic-db"
database_id = "dotra-traffic-db" # TODO: Replace with actual D1 database ID from `wrangler d1 create gate_access_db`

<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام تصاريح بوابات المركبات | Vehicle Gate Access System</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts: Cairo & Tajawal for Arabic, Inter for Latin -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- QR Code Generator & Scanner Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-sky-500 selection:text-white">

    <!-- Application Dynamic Navigation Bar -->
    <div id="app-header"></div>

    <!-- Main Dynamic Content Region -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6" id="main-content">
        <!-- Content injected by App controller -->
    </main>

    <!-- Modal Container for Passes, Permits & Forms -->
    <div id="modal-container"></div>

    <!-- Footer with Cloudflare Status -->
    <footer class="mt-auto border-t border-slate-800/80 py-4 px-4 text-center text-xs text-slate-500">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2">
            <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                <span>Cloudflare Workers & D1 Database Engine</span>
            </div>
            <div class="font-mono text-[11px] text-slate-400">
                <span>Enterprise Gate Access Control v2.4 (Bilingual Edition)</span>
            </div>
        </div>
    </footer>

    <!-- Application JavaScript Modules -->
    <script src="js/i18n.js"></script>
    <script src="js/arabic-plate.js"></script>
    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/manager.js"></script>
    <script src="js/officer.js"></script>
    <script src="js/app.js"></script>
</body>
</html>

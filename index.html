<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مجموعة دوترا | نظام تصاريح بوابات المركبات</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#002b66">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="بوابات دوترا">
    <link rel="apple-touch-icon" href="assets/logo.jpg">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sap: {
                            blue: '#0070f2',
                            'blue-hover': '#005cbd',
                            header: '#002b66',
                            bg: '#f5f8fc',
                            border: '#d7e2ee',
                            card: '#ffffff',
                            text: '#1d2d3e',
                            muted: '#556b82'
                        }
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts: Cairo & Tajawal for Arabic, Inter for Latin -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- QR Code Generator & Scanner (Self-Contained Engine) -->
    <script src="js/qr-engine.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <!-- Custom CSS (SAP Theme) -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-[#f5f8fc] text-[#1d2d3e] min-h-screen flex flex-col font-sans selection:bg-[#0070f2] selection:text-white">

    <!-- Application Dynamic SAP Header -->
    <div id="app-header"></div>

    <!-- Main Dynamic Content Region -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6" id="main-content">
        <!-- Content injected by App controller -->
    </main>

    <!-- Modal Container for Passes, Permits & Forms -->
    <div id="modal-container"></div>

    <!-- Live Real-Time Announcement Toast Container -->
    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 md:translate-x-0 md:left-auto md:right-4 z-50 flex flex-col gap-2.5 max-w-sm w-full pointer-events-none p-3"></div>

    <!-- SAP Footer -->
    <footer class="mt-auto border-t border-[#d7e2ee] bg-[#ffffff] py-3.5 px-4 text-center text-xs text-[#556b82]">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2">
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-[#107e3e]"></span>
                <span class="font-semibold text-[#1d2d3e]">DOTRA Group Gate Access Control</span>
                <span class="text-[#d7e2ee]">|</span>
                <span>SAP Enterprise Fiori Edition (Offline Enabled)</span>
            </div>
            <div class="font-mono text-[11px] text-[#556b82]">
                <span id="pwa-status-badge">⚡ Offline Ready (PWA Cache)</span>
            </div>
        </div>
    </footer>

    <!-- Application JavaScript Modules -->
    <script src="js/icons.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/arabic-plate.js"></script>
    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/manager.js"></script>
    <script src="js/officer.js"></script>
    <script src="js/app.js"></script>

    <!-- Service Worker Registration for 100% Offline Mode -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('🛡️ DOTRA Offline Service Worker Registered:', reg.scope))
                    .catch(err => console.log('SW registration note:', err));
            });
        }
    </script>
</body>
</html>

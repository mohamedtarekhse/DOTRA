<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مجموعة دوترا | بوابة الإدارة التنفيذية والرقابة العامة (CEO Portal)</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#001940">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="بوابة الإدارة دوترا">
    <link rel="apple-touch-icon" href="assets/logo.jpg">

    <!-- Tailwind CSS Enterprise JIT Engine -->
    <script>
        const origWarn = console.warn;
        console.warn = function(...args) {
            if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) return;
            origWarn.apply(console, args);
        };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sap: {
                            blue: '#0070f2',
                            'blue-hover': '#005cbd',
                            header: '#001940',
                            bg: '#f5f8fc',
                            border: '#d7e2ee',
                            card: '#ffffff',
                            text: '#1d2d3e',
                            muted: '#556b82'
                        }
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts: Cairo & Tajawal -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- QR Code Generator & Scanner -->
    <script src="js/qr-engine.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <!-- Custom CSS (SAP Theme) -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-[#f5f8fc] text-[#1d2d3e] min-h-screen flex flex-col font-sans selection:bg-[#0070f2] selection:text-white">

    <!-- Application Dynamic SAP Header -->
    <div id="app-header"></div>

    <!-- Main Dynamic Content Region -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6" id="main-content">
        <!-- Content injected by CEO controller -->
    </main>

    <!-- Modal Container for Passes, Permits & Forms -->
    <div id="modal-container"></div>

    <!-- Live Real-Time Announcement Toast Container -->
    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 md:translate-x-0 md:left-auto md:right-4 z-50 flex flex-col gap-2.5 max-w-sm w-full pointer-events-none p-3"></div>

    <!-- SAP Footer -->
    <footer class="mt-auto border-t border-[#d7e2ee] bg-[#ffffff] py-3.5 px-4 text-center text-xs text-[#556b82]">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2">
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-[#001940]"></span>
                <span class="font-black text-[#002b66]">DOTRA Executive Governance & Audit Center</span>
                <span class="text-[#d7e2ee]">|</span>
                <span>بوابة المتابعة العليا والرقابة على تدفق الشاحنات</span>
            </div>
            <div class="font-mono text-[11px] text-[#556b82]">
                <span>🏛️ Executive Access Mode</span>
            </div>
        </div>
    </footer>

    <!-- Application JavaScript Modules -->
    <script src="js/icons.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/arabic-plate.js"></script>
    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ceo.js"></script>
    <script src="js/manager.js"></script>
    <script src="js/officer.js"></script>
    <script src="js/push.js"></script>
    <script src="js/app.js"></script>

    <script>
        // Strictly guard and launch CEO view upon loading ceo.html
        window.addEventListener('DOMContentLoaded', async () => {
            if (window.DB && typeof window.DB.syncFromCloud === 'function') {
                await window.DB.syncFromCloud();
            }
            const user = window.Auth ? window.Auth.getCurrentUser() : null;
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            if (user.role !== 'ceo') {
                alert('عفواً، هذه الصفحة مخصصة حصرياً للرئيس التنفيذي والإدارة العليا.');
                window.location.href = 'index.html';
                return;
            }
            if (window.App) {
                window.App.currentView = 'ceo';
                window.App.renderApp();
            }
        });
    </script>
</body>
</html>
